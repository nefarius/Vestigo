# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Work is delivered as stacked PRs, so reviews must also run when the base is a feature branch.
reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
  path_filters:
    - "!docs/generated/**"
    - "!tests/fixtures/**/*.etl"
    - "!assets/**/*.png"
    - "!installer/License.rtf"
    - "!installer/DebugViewPP-LICENSE.txt"
    - "!installer/nefcon-LICENSE.txt"
  tools:
    gitleaks:
      enabled: false
    languagetool:
      enabled: false
    osvScanner:
      enabled: false
    presidio:
      enabled: false
    semgrep:
      enabled: false
    vale:
      enabled: false
