name: .NET

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release --nologo --filter Category!=WindowsElevated

      - name: Check generated API docs
        run: |
          dotnet tool install -g Nefarius.Tools.XMLDoc2Markdown --version 1.10.0
          ./scripts/generate-api-docs.sh
          git diff --exit-code -- docs/api

  build-installer:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      SIGN_RELAY_SERVER: ${{ vars.SIGN_RELAY_SERVER }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install WiX CLI and UI extension
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Require signing configuration
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGN_RELAY_CI_TOKEN: ${{ secrets.SIGN_RELAY_CI_TOKEN }}
        run: |
          if (-not $env:SIGN_RELAY_SERVER) { throw 'Repository variable SIGN_RELAY_SERVER is not set.' }
          if (-not $env:SIGN_RELAY_CI_TOKEN) { throw 'Repository secret SIGN_RELAY_CI_TOKEN is not set.' }

      - name: NUKE BuildInstaller
        if: ${{ success() && !startsWith(github.ref, 'refs/tags/v') }}
        run: .\build.ps1 BuildInstaller

      - name: Publish release binaries
        if: success() && startsWith(github.ref, 'refs/tags/v')
        run: .\build.ps1 PublishLocal

      - name: Assert assemblies are unsigned
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'publish-x64\server\Vestigo.exe'
            'publish-x64\server\Vestigo.dll'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "File not found: $file" }
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -ne 'NotSigned') {
              throw "Expected unsigned $file but Get-AuthenticodeSignature returned $($sig.Status)."
            }
          }

      - name: Sign assemblies
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: nefarius/SignRelay@32a835709950140362aafd5b9d837b190e61785e
        with:
          server: ${{ env.SIGN_RELAY_SERVER }}
          token: ${{ secrets.SIGN_RELAY_CI_TOKEN }}
          in-place: true
          files: |
            publish-x64/server/Vestigo.exe
            publish-x64/server/Vestigo.dll

      - name: Verify signed assemblies
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'publish-x64\server\Vestigo.exe'
            'publish-x64\server\Vestigo.dll'
          )
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -ne 'Valid' -or -not $sig.SignerCertificate) {
              throw "File is not validly signed: $file (Status=$($sig.Status))."
            }
          }

      - name: Build signed MSI
        if: success() && startsWith(github.ref, 'refs/tags/v')
        run: .\build.ps1 BuildInstaller --skip PublishLocal

      - name: Assert MSI is unsigned
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = 'publish-x64\installer\Vestigo.msi'
          if (-not (Test-Path -LiteralPath $file)) { throw "File not found: $file" }
          $sig = Get-AuthenticodeSignature -LiteralPath $file
          if ($sig.Status -ne 'NotSigned') {
            throw "Expected unsigned $file but Get-AuthenticodeSignature returned $($sig.Status)."
          }

      - name: Sign MSI
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: nefarius/SignRelay@32a835709950140362aafd5b9d837b190e61785e
        with:
          server: ${{ env.SIGN_RELAY_SERVER }}
          token: ${{ secrets.SIGN_RELAY_CI_TOKEN }}
          in-place: true
          skip-tool-install: true
          files: publish-x64/installer/Vestigo.msi

      - name: Verify signed MSI
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = 'publish-x64\installer\Vestigo.msi'
          $sig = Get-AuthenticodeSignature -LiteralPath $file
          if ($sig.Status -ne 'Valid' -or -not $sig.SignerCertificate) {
            throw "File is not validly signed: $file (Status=$($sig.Status))."
          }

      - name: Upload MSI artifact
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-msi
          path: publish-x64/installer/*.msi

      - name: Send webhook to Buildbot
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: nefarius/AppVeyorArtifactsReceiver@35ce2f75ea464aec25c8e17b30d607b310942fe7
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: ${{ github.event.repository.name }}-msi

  release:
    needs: build-installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download signed MSI
        uses: actions/download-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-msi
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Vestigo.msi
          fail_on_unmatched_files: true
          generate_release_notes: true
