name: .NET

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$tmp/gitleaks.tgz"
          echo "${GITLEAKS_SHA256}  $tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$tmp/gitleaks.tgz" -C "$tmp" gitleaks
          sudo install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          gitleaks detect --source . --verbose --redact --exit-code 1
          gitleaks dir . --verbose --redact --exit-code 1

      - name: Semgrep
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0 semgrep scan --config p/csharp --error --metrics=off /src

  osv-restore:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet lock files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @(
            'server/Vestigo.Server.csproj'
            'tests/Vestigo.Server.Tests/Vestigo.Server.Tests.csproj'
            'installer/Vestigo.Installer.csproj'
            'installer/Vestigo.Installer.Actions/Vestigo.Installer.Actions.csproj'
            'build/_build.csproj'
          )
          foreach ($project in $projects) {
            dotnet restore $project --no-dependencies -p:RestorePackagesWithLockFile=true
            if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed for $project" }
          }

      - name: Upload lock files
        uses: actions/upload-artifact@v7
        with:
          name: osv-lockfiles
          path: |
            build/packages.lock.json
            installer/packages.lock.json
            installer/Vestigo.Installer.Actions/packages.lock.json
            server/packages.lock.json
            tests/Vestigo.Server.Tests/packages.lock.json
          if-no-files-found: error
          retention-days: 1

  osv:
    needs: osv-restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download lock files
        uses: actions/download-artifact@v8
        with:
          name: osv-lockfiles
          path: .

      - name: OSV Scanner
        # Image published for osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 (v2.7.0).
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/google/osv-scanner-action@sha256:d54770fe0b09493894e76a02aaed9f51a0513fa57c5186452a755d257b0068a6 \
            --lockfile=build/packages.lock.json \
            --lockfile=installer/packages.lock.json \
            --lockfile=installer/Vestigo.Installer.Actions/packages.lock.json \
            --lockfile=server/packages.lock.json \
            --lockfile=tests/Vestigo.Server.Tests/packages.lock.json

  build:
    # Vestigo is Windows-only (SCM, registry, Win32 path rules), so tests must run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release --filter-not-trait "Category=WindowsElevated"

      # Build once: the payload staged here is the only input the installer job consumes.
      - name: Fallout publish and stage installer payload
        run: .\build.ps1 PublishLocal PrepareUpdater PrepareNefcon PrepareDebugView PrepareRipgrep

      - name: Upload publish payload
        uses: actions/upload-artifact@v7
        with:
          name: vestigo-publish-x64
          path: publish-x64/
          if-no-files-found: error
          retention-days: 3

  build-installer:
    needs: [build, security, osv]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      SIGN_RELAY_SERVER: ${{ vars.SIGN_RELAY_SERVER }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install WiX CLI and UI extension
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Firewall.wixext/5.0.2
          wix extension add -g WixToolset.Netfx.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Require signing configuration
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGN_RELAY_CI_TOKEN: ${{ secrets.SIGN_RELAY_CI_TOKEN }}
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if (-not $env:SIGN_RELAY_SERVER) { throw 'Repository variable SIGN_RELAY_SERVER is not set.' }
          if (-not $env:SIGN_RELAY_CI_TOKEN) { throw 'Repository secret SIGN_RELAY_CI_TOKEN is not set.' }
          if (-not $env:MINISIGN_PRIVATE_KEY) { throw 'Repository secret MINISIGN_PRIVATE_KEY is not set.' }
          if (-not $env:MINISIGN_PASSWORD) { throw 'Repository secret MINISIGN_PASSWORD is not set.' }

      - name: Download publish payload
        uses: actions/download-artifact@v8
        with:
          name: vestigo-publish-x64
          path: publish-x64

      - name: Assert publish payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'publish-x64\server\Vestigo.exe'
            'publish-x64\server\Vestigo.dll'
            'publish-x64\updater\Nefarius_Vestigo_Updater.exe'
            'publish-x64\tools\nefconc.exe'
            'publish-x64\tools\DebugViewConsole.exe'
            'publish-x64\tools\rg.exe'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "File not found in downloaded payload: $file" }
          }

      - name: Fallout BuildInstaller
        if: ${{ success() && !startsWith(github.ref, 'refs/tags/v') }}
        run: .\build.ps1 BuildInstaller --skip PublishLocal PrepareUpdater PrepareNefcon PrepareDebugView PrepareRipgrep

      - name: Assert assemblies are unsigned
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'publish-x64\server\Vestigo.exe'
            'publish-x64\server\Vestigo.dll'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "File not found: $file" }
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -ne 'NotSigned') {
              throw "Expected unsigned $file but Get-AuthenticodeSignature returned $($sig.Status)."
            }
          }

      - name: Sign assemblies
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: nefarius/SignRelay@31a8d34f0d7da6e44e9c4a794b0f51e0f5f2e8fd
        with:
          server: ${{ env.SIGN_RELAY_SERVER }}
          token: ${{ secrets.SIGN_RELAY_CI_TOKEN }}
          in-place: true
          files: |
            publish-x64/server/Vestigo.exe
            publish-x64/server/Vestigo.dll

      - name: Verify signed assemblies
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'publish-x64\server\Vestigo.exe'
            'publish-x64\server\Vestigo.dll'
          )
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -ne 'Valid' -or -not $sig.SignerCertificate) {
              throw "File is not validly signed: $file (Status=$($sig.Status))."
            }
          }

      - name: Build signed MSI
        if: success() && startsWith(github.ref, 'refs/tags/v')
        run: .\build.ps1 BuildInstaller --skip PublishLocal PrepareUpdater PrepareNefcon PrepareDebugView PrepareRipgrep

      - name: Resolve versioned MSI
        if: success() && startsWith(github.ref, 'refs/tags/v')
        id: msi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pointer = 'publish-x64\installer\current-msi.txt'
          if (-not (Test-Path -LiteralPath $pointer)) { throw "File not found: $pointer" }
          $name = (Get-Content -LiteralPath $pointer -Raw).Trim()
          if ($name -notmatch '^Vestigo-v.+\.msi$') {
            throw "Installer pointer is not a versioned MSI file name: $name"
          }
          $file = Join-Path 'publish-x64\installer' $name
          if (-not (Test-Path -LiteralPath $file)) { throw "File not found: $file" }
          $relative = $file -replace '\\', '/'
          "path=$file" >> $env:GITHUB_OUTPUT
          "relative=$relative" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Assert MSI is unsigned
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = '${{ steps.msi.outputs.path }}'
          if (-not (Test-Path -LiteralPath $file)) { throw "File not found: $file" }
          $sig = Get-AuthenticodeSignature -LiteralPath $file
          if ($sig.Status -ne 'NotSigned') {
            throw "Expected unsigned $file but Get-AuthenticodeSignature returned $($sig.Status)."
          }

      - name: Sign MSI
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: nefarius/SignRelay@31a8d34f0d7da6e44e9c4a794b0f51e0f5f2e8fd
        with:
          server: ${{ env.SIGN_RELAY_SERVER }}
          token: ${{ secrets.SIGN_RELAY_CI_TOKEN }}
          in-place: true
          skip-tool-install: true
          files: ${{ steps.msi.outputs.relative }}

      - name: Verify signed MSI
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = '${{ steps.msi.outputs.path }}'
          $sig = Get-AuthenticodeSignature -LiteralPath $file
          if ($sig.Status -ne 'Valid' -or -not $sig.SignerCertificate) {
            throw "File is not validly signed: $file (Status=$($sig.Status))."
          }

      - name: Sign update manifest
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          VESTIGO_MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = Join-Path $env:RUNNER_TEMP 'vestigo-minisign.key'
          try {
            [System.IO.File]::WriteAllText($keyPath, $env:MINISIGN_PRIVATE_KEY)
            $env:VESTIGO_MINISIGN_KEY = $keyPath
            .\build.ps1 PublishUpdateManifest --manifest-version ${{ github.run_id }}
          }
          finally {
            if (Test-Path -LiteralPath $keyPath) {
              Remove-Item -LiteralPath $keyPath -Force
            }
          }

      - name: Assert update feed files
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            '${{ steps.msi.outputs.path }}'
            'publish-x64\installer\updates.json'
            'publish-x64\installer\updates.json.minisig'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "File not found: $file" }
          }

      - name: Upload MSI artifact
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-msi
          path: |
            publish-x64/installer/Vestigo-v*.msi
            publish-x64/installer/updates.json
            publish-x64/installer/updates.json.minisig
          if-no-files-found: error

      - name: Send webhook to Buildbot
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: nefarius/AppVeyorArtifactsReceiver@35ce2f75ea464aec25c8e17b30d607b310942fe7
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: ${{ github.event.repository.name }}-msi

  release:
    needs: build-installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download signed MSI
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-msi
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Vestigo-v*.msi
            dist/updates.json
            dist/updates.json.minisig
          fail_on_unmatched_files: true
          generate_release_notes: true
