name: Generate API Documentation

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install XMLDoc2Markdown
        run: dotnet tool install -g Nefarius.Tools.XMLDoc2Markdown --version 1.10.0

      - name: Build
        run: dotnet build src/Vestigo.Server/Vestigo.Server.csproj -c Release

      - name: Generate API docs
        run: ./scripts/generate-api-docs.sh

      - name: Check for changes
        id: check-for-changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/api
          git diff --cached --exit-code || git commit -m "Update API documentation"

      - name: Push changes
        if: success() && steps.check-for-changes.outcome == 'success'
        run: git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
